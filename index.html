<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant IA Public - TP5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-bubble {
            max-width: 85%;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading-dot {
            animation: pulse-custom 1.5s infinite;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans antialiased text-slate-900">

    <!-- En-tête -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-20 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-800">Assistant IA Public</h1>
                    <div class="flex items-center gap-1.5">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        <span class="text-xs text-green-600 font-medium uppercase tracking-tighter">Accès Direct Illimité</span>
                    </div>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[10px] font-bold text-slate-400 uppercase bg-slate-100 px-2 py-1 rounded">Optimisé pour TP5</span>
            </div>
        </div>
    </header>

    <!-- Zone de Chat -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="max-w-3xl mx-auto space-y-6" id="messages-wrapper">
            <div class="flex justify-start animate-fade-in">
                <div class="message-bubble bg-white border border-slate-200 p-5 rounded-2xl rounded-tl-none shadow-sm text-slate-700">
                    <p class="font-semibold text-indigo-600 mb-1">Système Prêt</p>
                    Bonjour ! Je suis prêt à vous répondre de manière détaillée et précise. Posez-moi n'importe quelle question.
                </div>
            </div>
        </div>
    </main>

    <!-- Indicateur de chargement -->
    <div id="loading-indicator" class="hidden max-w-3xl mx-auto px-8 mb-4">
        <div class="flex items-center gap-3 text-slate-400 text-sm font-medium">
            <div class="flex gap-1.5">
                <span class="w-2 h-2 bg-indigo-400 rounded-full loading-dot"></span>
                <span class="w-2 h-2 bg-indigo-400 rounded-full loading-dot" style="animation-delay: 0.2s"></span>
                <span class="w-2 h-2 bg-indigo-400 rounded-full loading-dot" style="animation-delay: 0.4s"></span>
            </div>
            L'IA prépare une réponse de qualité...
        </div>
    </div>

    <!-- Barre de saisie -->
    <footer class="bg-white border-t border-slate-200 p-4 md:p-6">
        <div class="max-w-3xl mx-auto">
            <form id="chat-form" class="relative group">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Posez votre question ici..." 
                    class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 pl-6 pr-16 focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none text-slate-700 shadow-sm"
                    autocomplete="off"
                >
                <button type="submit" id="send-button" class="absolute right-2 top-2 bottom-2 px-4 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all shadow-md active:scale-95 disabled:opacity-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>
            <p class="text-[10px] text-center text-slate-400 mt-4 italic">
                Réponses fiables garanties • Sans clé personnelle
            </p>
        </div>
    </footer>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";
        const apiKey = ""; // La clé est fournie par l'environnement de rendu lors de l'exécution

        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('messages-wrapper');
        const scrollArea = document.getElementById('chat-container');
        const loadingIndicator = document.getElementById('loading-indicator');
        const sendButton = document.getElementById('send-button');

        let chatHistory = [];

        async function getAIResponse(userText) {
            // Ajout du message utilisateur à l'historique
            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            // Système de retry exponentiel pour éviter les erreurs
            const maxRetries = 3;
            let attempt = 0;

            while (attempt < maxRetries) {
                try {
                    const response = await fetch(`${API_URL}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: chatHistory,
                            generationConfig: {
                                temperature: 0.7,
                                maxOutputTokens: 1000,
                            }
                        })
                    });

                    if (!response.ok) throw new Error("Problème de réseau");

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text) {
                        chatHistory.push({ role: "model", parts: [{ text: text }] });
                        return text;
                    }
                } catch (e) {
                    attempt++;
                    if (attempt === maxRetries) return "Je rencontre une surcharge momentanée, mais je reste à votre service. Pouvez-vous reformuler votre question ?";
                    await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
                }
            }
        }

        function displayMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in mb-4`;
            
            const inner = document.createElement('div');
            inner.className = `message-bubble p-4 rounded-2xl shadow-sm ${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-700 rounded-tl-none'}`;
            
            // Gestion du formatage simple (retours à la ligne)
            inner.innerHTML = text.replace(/\n/g, '<br>');
            
            div.appendChild(inner);
            chatContainer.appendChild(div);
            scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;
            
            displayMessage(message, true);
            loadingIndicator.classList.remove('hidden');

            const response = await getAIResponse(message);
            
            loadingIndicator.classList.add('hidden');
            displayMessage(response, false);
            userInput.disabled = false;
            sendButton.disabled = false;
            userInput.focus();
        });
    </script>
</body>
</html>
