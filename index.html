<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA - Rendu TP 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-bubble {
            max-width: 80%;
            word-wrap: break-word;
        }
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading-dot {
            animation: pulse-custom 1.5s infinite;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans">

    <!-- En-tête -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">Assistant IA Pro</h1>
                    <p class="text-xs text-green-500 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span> OpenRouter Connecté
                    </p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">TP 5 - OpenRouter</span>
            </div>
        </div>
    </header>

    <!-- Zone des messages -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
        <div class="max-w-4xl mx-auto space-y-6" id="messages-wrapper">
            <div class="flex justify-start">
                <div class="message-bubble bg-white border border-slate-200 text-slate-700 p-4 rounded-2xl rounded-tl-none shadow-sm">
                    Bonjour ! Je suis prêt pour vos tests. J'utilise votre nouvelle clé API pour répondre à vos messages.
                </div>
            </div>
        </div>
    </main>

    <!-- Indicateur de chargement -->
    <div id="loading-indicator" class="hidden max-w-4xl mx-auto px-6 mb-4">
        <div class="flex items-center gap-2 text-slate-400 text-sm">
            <div class="flex gap-1">
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full loading-dot" style="animation-delay: 0s"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full loading-dot" style="animation-delay: 0.2s"></span>
                <span class="w-1.5 h-1.5 bg-slate-400 rounded-full loading-dot" style="animation-delay: 0.4s"></span>
            </div>
            Réflexion en cours...
        </div>
    </div>

    <!-- Zone de saisie -->
    <footer class="bg-white border-t border-slate-200 p-4 pb-8 md:pb-4">
        <div class="max-w-4xl mx-auto">
            <form id="chat-form" class="relative flex items-center">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Tapez votre message ici..." 
                    class="w-full bg-slate-100 border-none rounded-2xl py-4 pl-6 pr-14 focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-slate-700"
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    class="absolute right-2 p-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-colors shadow-md disabled:opacity-50"
                    id="send-button"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </form>
        </div>
    </footer>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('messages-wrapper');
        const scrollContainer = document.getElementById('chat-container');
        const loadingIndicator = document.getElementById('loading-indicator');
        const sendButton = document.getElementById('send-button');
        
        // --- CONFIGURATION ---
        // Mise à jour avec la nouvelle clé fournie
        const apiKey = "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"; 
        const API_URL = "https://openrouter.ai/api/v1/chat/completions";

        let messages = [];

        async function fetchAIResponse(prompt) {
            messages.push({ role: "user", content: prompt });

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "google/gemini-2.0-flash-lite-preview-02-05:free", 
                        messages: messages
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    console.error("Réponse API invalide:", data);
                    throw new Error(data.error?.message || "Erreur réseau");
                }
                
                const reply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: reply });
                return reply;

            } catch (err) {
                console.error("Erreur attrapée:", err);
                throw err;
            }
        }

        function appendMessage(text, isUser = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} animate-fade-in mb-4`;
            
            const bubble = document.createElement('div');
            bubble.className = `message-bubble p-4 rounded-2xl shadow-sm ${
                isUser 
                ? 'bg-indigo-600 text-white rounded-tr-none' 
                : 'bg-white border border-slate-200 text-slate-700 rounded-tl-none'
            }`;
            bubble.textContent = text;
            
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: 'smooth' });
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const val = userInput.value.trim();
            if (!val) return;

            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;
            appendMessage(val, true);
            loadingIndicator.classList.remove('hidden');

            try {
                const reply = await fetchAIResponse(val);
                appendMessage(reply, false);
            } catch (e) {
                appendMessage("Impossible de joindre l'IA. Vérifiez que la clé API est toujours valide dans le code source ou essayez de rafraîchir la page.", false);
            } finally {
                loadingIndicator.classList.add('hidden');
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        });
    </script>
</body>
</html>
